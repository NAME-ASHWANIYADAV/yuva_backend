# SUNFLOW site configuration: Lamjana 33/11 kV substation, Latur district, Maharashtra.
# Provenance tags: PUBLIC = read from a public document; ASSUMED = our assumption (range given);
# SYNTHETIC = generated by us from the assumptions. No DT register, pump inventory or telemetry is public.

site:
  name: "Lamjana 33/11 kV substation"
  district: "Latur"
  state: "Maharashtra"
  latitude: 18.4088        # ASSUMED: Latur-district coordinate; the substation's exact coordinates are not public
  longitude: 76.5604       # ASSUMED (same)
  altitude_m: 630          # ASSUMED
  timezone: "Asia/Kolkata"

sources:                   # PUBLIC documents the rules and topology are taken from
  kusum_c_circular: "MSEDCL KUSUM-C daytime Ag circular CE(PP)/Latur, 06.08.2024 (4 substations, 13 feeders, PT structure, slots, clause 1 manual switching, clause 3 night compensation)"
  aglm_circular: "MSEDCL CE(PM&T)/LM/AgLM/8 Hrs Supply/25941, 31.07.2026 (8 h 3-phase, daytime staggered 07:30-17:30 on solarised feeders, 50 MW per 15-min switching cap, manual switching)"
  mskvy: "MSKVY 2.0 GR 13.09.2024 (16,000 MW target)"

plant:
  capacity_mw_ac: 5.0      # PUBLIC: KUSUM-C circular lists a 5 MW plant at Lamjana
  dc_ac_ratio: 1.25        # ASSUMED (typical utility-scale 1.2-1.3)
  tilt_deg: 18             # ASSUMED (close to latitude)
  azimuth_deg: 180         # ASSUMED (south facing)
  system_losses_frac: 0.14 # ASSUMED (PVWatts default)
  gamma_pdc_per_c: -0.004  # ASSUMED (crystalline silicon)
  noct_c: 45.0             # ASSUMED

power_transformers:
  - name: "PT-1"
    rating_kva: 5000       # PUBLIC
  - name: "PT-2"
    rating_kva: 5000       # PUBLIC

feeders:
  # published_slot: PUBLIC (Annexure A of the KUSUM-C circular). DT counts and mix: ASSUMED.
  # DT counts are ASSUMED and calibrated so that (a) the three PT-2 feeders fit under 5 MVA at the P90
  # participation used for planning/verification (0.9) but NOT at full participation (1.0), matching the
  # published 6.5 h three-feeder overlap that MSEDCL operates today, and (b) 63 kVA DTs run near their IEC
  # hot-spot limit on hot afternoons under the pessimistic thermal band.
  - name: "Kharosa"
    pt: "PT-1"
    published_slot: ["09:30", "17:30"]
    n_dts: 18
    dt_kva_pattern: [100, 63]
    crop_group: "kharif_cotton"
  - name: "Jawali"
    pt: "PT-2"
    published_slot: ["09:00", "17:00"]
    n_dts: 24
    dt_kva_pattern: [100, 63]
    crop_group: "kharif_soybean"
    rabi_crop_group: "rabi_chana"      # ASSUMED rotation soybean -> chickpea
  - name: "Lamjana II"
    pt: "PT-2"
    published_slot: ["07:30", "15:30"]
    n_dts: 28
    dt_kva_pattern: [100, 63]
    crop_group: "kharif_tur"
  - name: "Chalburga"
    pt: "PT-2"
    published_slot: ["08:30", "16:30"]
    n_dts: 24
    dt_kva_pattern: [100, 63]
    crop_group: "kharif_soybean"
    rabi_crop_group: "rabi_wheat"      # ASSUMED rotation soybean -> wheat

distribution_transformers:   # ASSUMED, per DT rating class; SYNTHETIC inventory is generated from these
  pumps_per_dt:
    "63": 9                # 9 pumps x 5 HP on a 63 kVA DT   (ASSUMED; range 8-12) -> 0.83 pu at full participation
    "100": 15              # 15 pumps x 5 HP on a 100 kVA DT (ASSUMED; range 14-20) -> 0.87 pu at full participation
  irrigated_ha_per_pump: 1.6   # ASSUMED (smallholder, 1-2 ha per pump)

pumps:
  hp: 5                    # ASSUMED (3-7.5 HP typical)
  kva_per_pump: 5.8        # ASSUMED: 5 HP, motor efficiency 0.8, power factor 0.8
  power_factor: 0.8        # ASSUMED
  discharge_m3_per_h: 25   # ASSUMED (5 HP at ~30 m head, pump efficiency ~0.6)

participation:             # share of installed pump kVA drawing when the feeder is energised
  default: 0.8             # ASSUMED (range 0.5-1.0); surge in the first two blocks after energisation = 1.0
  surge_blocks: 2
  surge_level: 1.0
  sweep_range: [0.5, 1.0]

rules:                     # PUBLIC unless marked
  window_start: "07:30"
  window_end: "17:30"      # exclusive; Annexure windows run to 17:30 (some substations 18:00)
  min_blocks_per_feeder: 32          # 8 hours of 3-phase supply per day
  max_spells: 1                      # today's practice: one contiguous spell (option 2 is gated by farmer labour window)
  min_spell_blocks: 8                # ASSUMED when two spells are allowed (2 h minimum)
  min_off_blocks_between_spells: 4   # ASSUMED (1 h minimum break)
  min_start_separation_blocks: 2     # PUBLIC-derived: published starts are staggered by >= 30 min
  substation_switch_cap_kva: 2500    # ASSUMED share of MSEDCL's state-wide 50 MW per 15-min switching cap
  max_night_compensation_blocks: 8   # ASSUMED cap (2 h) on the circular's clause-3 night compensation

thermal:                   # IEC 60076-7 exponential-equation constants, ONAN distribution transformers (via open reproductions; the standard is paywalled)
  delta_theta_or_k: 55.0   # rated top-oil rise
  delta_theta_hr_k: 23.0   # rated hot-spot-to-top-oil gradient
  ratio_r: 5.0             # load/no-load loss ratio
  x: 0.8
  y: 1.6
  k11: 1.0
  k21: 1.0
  k22: 2.0
  tau_o_min: 180.0
  tau_w_min: 4.0
  hot_spot_limit_c: 120.0  # normal cyclic loading limit for distribution transformers
  ageing_reference_c: 98.0
  uncertainty_band: 0.30   # ASSUMED +/-30% band on rises and time constants
  initial_top_oil_rise_k: 5.0   # ASSUMED state at midnight (transformer nearly cold)

verification:              # pessimistic settings used by the independent verifier AND adopted by the planner (robust planning)
  ambient_offset_c: 3.0    # ASSUMED P90-type offset on ambient temperature
  thermal_factor: 1.3      # upper band of thermal constants
  participation: 0.9       # ASSUMED P90 participation (expected 0.8; 1.0 = 'everyone switches on' stress scenario)
  solar_quantile: "p10"

economics:
  appc_inr_per_kwh: 4.5        # ASSUMED proxy for MSEDCL average power purchase cost (verify from MERC MYT order)
  surplus_value_inr_per_kwh: 2.5  # ASSUMED value of solar not used on the feeder (exported)
  dt_repair_inr: 250000        # PUBLIC single-source estimate (Gujarat study: Rs 2-3 lakh)

crops:                     # FAO-56 single-Kc stages; Kc values from FAO-56 Table 12 / PoCRA Maharashtra calibration (PUBLIC methods; assignment to feeders ASSUMED)
  kharif_soybean: {kc_ini: 0.40, kc_mid: 1.15, kc_end: 0.50, stage_days: [20, 30, 60, 25], sowing_doy: 170, root_depth_m: 0.9, depletion_p: 0.50, taw_mm_per_m: 140}
  kharif_cotton:  {kc_ini: 0.51, kc_mid: 1.30, kc_end: 0.85, stage_days: [30, 50, 60, 55], sowing_doy: 165, root_depth_m: 1.2, depletion_p: 0.65, taw_mm_per_m: 140}
  kharif_tur:     {kc_ini: 0.40, kc_mid: 1.10, kc_end: 0.45, stage_days: [25, 35, 70, 40], sowing_doy: 170, root_depth_m: 1.0, depletion_p: 0.50, taw_mm_per_m: 140}
  rabi_wheat:     {kc_ini: 0.71, kc_mid: 1.31, kc_end: 0.76, stage_days: [15, 25, 50, 30], sowing_doy: 320, root_depth_m: 1.0, depletion_p: 0.55, taw_mm_per_m: 140}
  rabi_chana:     {kc_ini: 0.40, kc_mid: 1.00, kc_end: 0.35, stage_days: [20, 30, 40, 20], sowing_doy: 300, root_depth_m: 0.8, depletion_p: 0.50, taw_mm_per_m: 140}

irrigation:
  application_efficiency: 0.6     # ASSUMED (flood irrigation)
  effective_rain_fraction: 0.8    # ASSUMED
  initial_depletion_frac: 0.3     # ASSUMED soil state at start of simulation
