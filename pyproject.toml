[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunflow"
version = "0.1.0"
description = "SUNFLOW: constraint-verified day-ahead and intra-day switching planner for solarised agricultural feeders (Lamjana case)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "requests>=2.31",
  "pvlib>=0.10",
  "pyomo>=6.7",
  "highspy>=1.7",
  "lightgbm>=4.0",
  "scikit-learn>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["sunflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
